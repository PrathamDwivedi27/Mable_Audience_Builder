services:
  postgres:
    image: postgres:16-alpine
    container_name: mable-postgres
    environment:
      POSTGRES_USER: mable
      POSTGRES_PASSWORD: mable_dev_password
      POSTGRES_DB: mable_audience
    ports:
      - "5432:5432"
    volumes:
      - mable_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mable -d mable_audience"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  mable_pgdata:
